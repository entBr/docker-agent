name: Fork image

on:
  workflow_call:

permissions: {}

concurrency:
  group: fork-image-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'entBr/docker-agent' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Authenticate to the fork registry
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Build and publish the verified commit
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          github-token: ''
          tags: ghcr.io/entbr/docker-agent:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/entBr/docker-agent
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GIT_TAG=fork
            GIT_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=fork-image
          cache-to: type=gha,mode=max,scope=fork-image

      - name: Verify the published manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          docker buildx imagetools inspect "ghcr.io/entbr/docker-agent@$IMAGE_DIGEST"
          {
            echo '## Fork image published'
            echo "Image: ghcr.io/entbr/docker-agent@$IMAGE_DIGEST"
            echo 'Package: https://github.com/entBr/docker-agent/pkgs/container/docker-agent'
          } >> "$GITHUB_STEP_SUMMARY"
